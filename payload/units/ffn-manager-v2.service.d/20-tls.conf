[Service]
# The TLS arguments are APPENDED by the start wrapper rather than restated as a
# whole command line. The previous version repeated the entire uvicorn
# invocation including `--host 0.0.0.0`, so the bind address existed in two
# places and this copy was the one that actually ran -- a drop-in ExecStart=
# override wins. Fixing the base unit alone would have changed nothing.
ExecStart=
ExecStart=/usr/local/sbin/ffn-manager-start.sh --ssl-keyfile /etc/ffn-ngfw/tls/server.key --ssl-certfile /etc/ffn-ngfw/tls/server.crt
